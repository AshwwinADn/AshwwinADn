<rect x="310" y="54" width="260" height="73" rx="11" fill="#101922" stroke="#29435b"/>
  <rect x="310" y="67" width="3" height="45" rx="1" fill="#53ba92"/>
  <text x="326" y="83" fill="#f0f5fb" font-size="16" font-weight="650">Impact</text>
