<svg xmlns="http://www.w3.org/2000/svg" width="880" height="153" viewBox="0 0 880 153" role="img">
  <title>GitHub highlights</title>
  <defs>
    <linearGradient id="card-rim" x2="100%" y2="100%">
      <stop stop-color="#122235"/>
