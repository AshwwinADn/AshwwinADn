  <ellipse cx="677" cy="42" rx="176" ry="39" fill="url(#card-glow)"/>
  <g font-family="system-ui, sans-serif">
    <text x="39" y="43" fill="#9ab2c8" font-size="12" font-weight="650">Highlights</text>
