<svg xmlns="http://www.w3.org/2000/svg" width="880" height="162" viewBox="0 0 880 162" role="img">
  <title>GitHub highlights</title>
  <defs>
    <linearGradient id="card-rim" x2="100%" y2="100%">
      <stop stop-color="#172b40"/>
      <stop offset=".45" stop-color="#0d151e"/>
      <stop offset="1" stop-color="#17303a"/>
    </linearGradient>
    <radialGradient id="card-glow">
      <stop stop-color="#245345" stop-opacity=".6"/>
      <stop offset="1" stop-color="#14362f" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="violet-glow">
      <stop stop-color="#7351a1" stop-opacity=".34"/>
      <stop offset="1" stop-color="#7351a1" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="blue-glow">
      <stop stop-color="#366794" stop-opacity=".4"/>
      <stop offset="1" stop-color="#366794" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect x="1" y="1" width="878" height="160" rx="20" fill="url(#card-rim)" stroke="#30495f"/>
  <ellipse cx="115" cy="26" rx="110" ry="25" fill="url(#blue-glow)"/>
  <ellipse cx="543" cy="145" rx="226" ry="16" fill="url(#violet-glow)"/>
  <rect x="23" y="19" width="834" height="124" rx="15" fill="#0b1119" fill-opacity=".88" stroke="#273e51"/>
  <ellipse cx="700" cy="46" rx="148" ry="28" fill="url(#card-glow)"/>
  <g font-family="system-ui, sans-serif">
    <text x="39" y="47" fill="#a6bbcc" font-size="12" font-weight="700">Highlights</text>
    <rect x="38" y="61" width="260" height="72" rx="12" fill="#0b131c" fill-opacity=".94" stroke="#30485c"/>
  <rect x="39" y="76" width="3" height="42" rx="1" fill="#5a9bef"/>
  <text x="55" y="89" fill="#eef5fc" font-size="16" font-weight="700">Open Source</text>
  <text x="55" y="111" fill="#b1c0ce" font-size="13">1 public repositories</text>
<rect x="310" y="61" width="260" height="72" rx="12" fill="#0b131c" fill-opacity=".94" stroke="#30485c"/>
  <rect x="311" y="76" width="3" height="42" rx="1" fill="#53ba92"/>
  <text x="327" y="89" fill="#eef5fc" font-size="16" font-weight="700">Impact</text>
  <text x="327" y="111" fill="#b1c0ce" font-size="13">0 stars earned</text>
<rect x="582" y="61" width="260" height="72" rx="12" fill="#0b131c" fill-opacity=".94" stroke="#30485c"/>
  <rect x="583" y="76" width="3" height="42" rx="1" fill="#a48ceb"/>
  <text x="599" y="89" fill="#eef5fc" font-size="16" font-weight="700">Community</text>
  <text x="599" y="111" fill="#b1c0ce" font-size="13">3 followers</text></g>
</svg>
